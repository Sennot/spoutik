name: Build Baconsistent (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Baconsistent source version
        shell: pwsh
        run: |
          $mod = Get-Content -Raw ./mod.json | ConvertFrom-Json
          Write-Host "Baconsistent source version: $($mod.version)"
          if ($mod.version -ne "v0.4.2") {
            throw "Wrong/stale repository root. Expected Baconsistent v0.4.2, got $($mod.version)."
          }
          $required = @(
            "./src/ui/TrainingPopup.cpp",
            "./src/core/TrainingStats.cpp",
            "./src/runtime/StartPosAnalyzer.cpp",
            "./src/ui/PauseProgressBar.cpp",
            "./src/ui/ProgressNotification.cpp",
            "./src/core/AttemptGuard.cpp",
            "./src/core/NoclipHitDetector.cpp",
            "./resources/pause-icon.png",
            "./resources/header-brand.png",
            "./resources/stage-row.png",
            "./resources/round-ribbon.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing v0.4.2 source/resource: $path" }
          }

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload Baconsistent
        uses: actions/upload-artifact@v7
        with:
          name: Baconsistent-v0.4.2-Windows
          path: ${{ steps.build.outputs.build-output }}
