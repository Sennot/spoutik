name: Build Windows Geode mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test bootstrap and audited XDBot transform
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Fetch pinned XDBot Layout Mode sources
        run: python tools/bootstrap_deps.py

      - name: Verify local source invariants
        run: python tools/verify_bindings.py

      - name: Verify declarations in official Geode 2.2081 bindings
        run: python tools/verify_upstream_bindings.py

      - name: Validate embedded dependencies
        run: python tools/bootstrap_deps.py --validate-only

      - name: Build against Geode v5.8.2 / Win64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.8.2
          target: Win64
          build-config: Release
          use-lto: true

      - name: Verify bridge-only .geode package
        shell: pwsh
        run: python tools/verify_geode_package.py '${{ steps.build.outputs.build-output }}'

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: LayoutCompanionBridge-Win64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

      - name: Build SDL3 + OpenGL companion
        shell: pwsh
        run: |
          cmake -S companion -B companion/build -A x64
          cmake --build companion/build --config Release --parallel

      - name: Verify companion runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'companion/build/bin/LayoutCompanion.exe')) { throw 'LayoutCompanion.exe missing' }
          if (-not (Test-Path -LiteralPath 'companion/build/bin/SDL3.dll')) { throw 'SDL3.dll missing' }

      - name: Upload companion application
        uses: actions/upload-artifact@v4
        with:
          name: LayoutCompanion-SDL3-Win64
          path: |
            companion/build/bin/LayoutCompanion.exe
            companion/build/bin/SDL3.dll
          if-no-files-found: error
